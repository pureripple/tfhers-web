spring:
  application:
    name: tfhers-web-app
  datasource:
    url: ${TFHERS_DB_URL:jdbc:mysql://localhost:3306/tfhers}
    username: ${TFHERS_DB_USERNAME:root}
    password: ${TFHERS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

# Management base URL; override via TFHERS_MANAGEMENT_BASE_URL in production
tfhers:
  management:
    base-url: ${TFHERS_MANAGEMENT_BASE_URL:http://localhost:8081}
  cors:
    # Same key as management; prod set CORS_ALLOWED_ORIGINS (no *)
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080,http://localhost:8081}"

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
