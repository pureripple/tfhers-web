<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tfhers-"Them's Fightin' Herds"玩家们的社区</title>
    <link href="/css/fonts-local.css" rel="stylesheet" />
    <link href="/vendor/font-awesome/css/all.min.css" rel="stylesheet" />
    <link href="/css/main.css" rel="stylesheet" />
    <link href="/css/responsive.css" rel="stylesheet" />
    <link href="/css/character-detail.css" rel="stylesheet" />
    <link href="/css/combo-detail.css" rel="stylesheet" />
    <link href="/css/tournaments.css" rel="stylesheet" />
    <link href="/css/rankings.css" rel="stylesheet" />
    <link href="/css/rooms.css" rel="stylesheet" />
    <link href="/css/ai-chat.css" rel="stylesheet" />
    <script>
      /* Early paint: only mark authed when stored user has a token (Vue API needs it). */
      (function () {
        try {
          document.title = "tfhers-\"Them's Fightin' Herds\"玩家们的社区";
          var raw = localStorage.getItem('user');
          if (!raw) return;
          var u = JSON.parse(raw);
          if (u && u.token) {
            document.documentElement.classList.add('tfhers-authed');
          }
          if (localStorage.getItem('tfhers_sidebar_collapsed') === '1') {
            document.documentElement.classList.add('sidebar-collapsed');
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script>
      (function () {
        try {
          if (localStorage.getItem('tfhers-theme') === 'light') {
            document.documentElement.classList.add('theme-light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
