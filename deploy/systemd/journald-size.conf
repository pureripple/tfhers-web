# 限制 systemd journal 的磁盘占用（CentOS Stream 9 / systemd）
#
# 安装：
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/systemd/journald-size.conf /etc/systemd/journald.conf.d/tfhers-size.conf
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage
#
# 为什么需要它：应用只写 stdout，日志全部落在 journal 里。之前 MyBatis 用的是
# StdOutImpl，每条 SQL 一行，journal 会一直涨；默认 SystemMaxUse 是所在分区的 10%，
# 一块 40G 盘能涨到 4G。写满系统盘后 MySQL 写入失败，表现就是全站 500。
#
# 说明：
#   - 应用侧已改成 Slf4jImpl + INFO 级，SQL 不再逐条打印（这才是主要止血手段）
#   - 这里只是给 journal 加一条硬上限，防止将来任何原因导致的日志暴涨
#   - restart systemd-journald 不会重启业务服务，安全
#   - 改小上限后 journald 会自动把旧日志 vacuum 掉

[Journal]
# 全部 journal 文件（含所有服务的）总上限
SystemMaxUse=500M
# 单个 journal 文件上限，超过就滚动
SystemMaxFileSize=50M
# 保留时长上限，超期自动删除
MaxRetentionSec=30day
