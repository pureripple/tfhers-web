# TFHers — nginx site (Aliyun ECS)
# Deployed by GitHub Actions to /etc/nginx/conf.d/tfhers.conf when nginx/workflow changes.
# Vue SPA (user + admin) at /opt/tfhers/frontend/www; legacy Spring static dirs on disk stay untouched.
# If an existing server{} already terminates TLS for this host, merge the location blocks below into
# that server and disable this catch-all (or set server_name to your real domain and add ssl_*).

upstream tfhers_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream tfhers_management {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/tfhers/frontend/www;
    index index.html;

    client_max_body_size 32m;

    # Management API (more specific prefixes first) — mirrors frontend/vite.config.ts proxy
    location ^~ /api/admin {
        proxy_pass http://tfhers_management;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ^~ /api/user-management {
        proxy_pass http://tfhers_management;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ^~ /api/profile {
        proxy_pass http://tfhers_management;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ^~ /api/articles {
        proxy_pass http://tfhers_management;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://tfhers_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Vue Router history mode (user / + admin /admin)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
