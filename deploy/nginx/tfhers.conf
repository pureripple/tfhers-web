# TFHers — nginx site (Aliyun ECS)
# STAGED SPA conf (not live). Live site uses legacy static at /opt/tfhers/frontend/www +
# /admin/ -> /opt/tfhers/backend/www. Vue dist builds go to /opt/tfhers/frontend/www-vue until cutover.
# TLS: this host listens HTTP :80 only (CDN/SLB may terminate HTTPS upstream).
# Production: only tfhers-management :8081 is active; all /api/ proxies there.
# When tfhers-app :8080 is enabled, split management prefixes like frontend/vite.config.ts.

upstream tfhers_management {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tfhers.cn www.tfhers.cn;

    root /opt/tfhers/frontend/www;
    index index.html;

    # 连段视频最大 150MB，需大于默认 1m
    client_max_body_size 150m;

    location /api/ {
        proxy_pass http://tfhers_management;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Vue Router history mode (user / + admin /admin)
    # Do NOT alias /admin to /opt/tfhers/backend/www — that served legacy admin HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
