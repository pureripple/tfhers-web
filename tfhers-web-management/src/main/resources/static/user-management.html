<!DOCTYPE html>
<html lang="zh-CN" class="tfhers-admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - TFhers管理后台</title>
    <link rel="stylesheet" href="css/fonts-local.css">
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="css/index.css?v=20261024a">
    <style>
        /* 用户管理页局部样式（弹窗等全局样式见 css/index.css） */
        .user-management-content {
            padding: clamp(16px, 2vw, 28px);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .user-management-content .page-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin: 0;
        }

        .search-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            max-width: 360px;
            padding: 11px 16px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            background: rgba(17, 17, 22, 0.65);
            color: var(--text-primary);
            font-size: 14px;
            transition: border-color 0.28s var(--ease-out), box-shadow 0.28s var(--ease-out);
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(255, 122, 122, 0.45);
            box-shadow: 0 0 0 3px rgba(255, 122, 122, 0.12);
        }

        .filter-select {
            padding: 11px 16px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            min-width: 128px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            min-width: 60px;
            white-space: nowrap;
        }

        .users-table {
            background: rgba(17, 17, 22, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-sm);
        }

        .users-table .table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table .table th,
        .users-table .table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .users-table .table th:last-child,
        .users-table .table td:last-child {
            width: 300px;
            min-width: 300px;
        }

        .users-table .table th {
            background: rgba(24, 24, 31, 0.9);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
        }

        .users-table .table td {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .users-table .table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .users-table .table .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-strong);
        }

        .users-table .table .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .users-table .table .user-details h4 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .users-table .table .user-details p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-badge,
        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(94, 207, 138, 0.14);
            color: var(--success-color);
            border: 1px solid rgba(94, 207, 138, 0.28);
        }

        .status-inactive {
            background: rgba(240, 113, 103, 0.12);
            color: var(--danger-color);
            border: 1px solid rgba(240, 113, 103, 0.28);
        }

        .role-user {
            background: rgba(126, 182, 255, 0.12);
            color: var(--info-color);
            border: 1px solid rgba(126, 182, 255, 0.28);
        }

        .role-admin {
            background: rgba(240, 180, 41, 0.12);
            color: var(--warning-color);
            border: 1px solid rgba(240, 180, 41, 0.28);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #pagination.pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        #pagination.pagination button {
            padding: 8px 14px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: rgba(17, 17, 22, 0.6);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.28s var(--ease-out);
        }

        #pagination.pagination button:hover:not(:disabled) {
            background: var(--bg-tertiary);
            border-color: rgba(255, 122, 122, 0.35);
        }

        #pagination.pagination button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #pagination.pagination .active {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: #0c0c10;
            border-color: transparent;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(255, 122, 122, 0.22);
        }

        .pagination-info {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .loading.show {
            display: block;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--text-muted);
        }
        
        .empty-state h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: var(--text-secondary);
        }
        
        .empty-state p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
            <aside class="app-sidebar" id="appSidebar" aria-label="管理导航">
        <div class="sidebar-top">
            <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="收起侧栏" title="收起/展开">
                <i class="fas fa-bars"></i>
            </button>
            <span class="sidebar-brand">tfhers管理端</span>
        </div>
        <nav class="sidebar-nav" id="navMenu">
            <a href="index.html#articles" class="nav-link">
                <i class="fas fa-newspaper"></i><span>资讯管理</span>
            </a>
            <a href="index.html#characters" class="nav-link">
                <i class="fas fa-users"></i><span>角色管理</span>
            </a>
            <a href="index.html#user-combos" class="nav-link">
                <i class="fas fa-user-check"></i><span>用户连段审核</span>
            </a>
            <a href="index.html#reports" class="nav-link">
                <i class="fas fa-flag"></i><span>举报处理</span>
            </a>
            <a href="index.html#feedback" class="nav-link">
                <i class="fas fa-comment-dots"></i><span>问题反馈</span>
            </a>
            <a href="index.html#comment-review" class="nav-link">
                <i class="fas fa-comments"></i><span>评论审核</span>
            </a>
            <a href="index.html#statistics" class="nav-link">
                <i class="fas fa-chart-line"></i><span>数据统计</span>
            </a>
            <a href="index.html#games" class="nav-link">
                <i class="fas fa-gamepad"></i><span>游戏管理</span>
            </a>
            <a href="index.html#tournaments" class="nav-link">
                <i class="fas fa-trophy"></i><span>赛事管理</span>
            </a>
            <a href="ai-chat.html" class="nav-link nav-link-ai">
                <i class="fas fa-robot"></i><span>AI 助手</span>
            </a>
            <a href="user-management.html?v=1" class="nav-link active">
                <i class="fas fa-user-cog"></i><span>用户管理</span>
            </a>
            <a href="profile.html?v=1" class="nav-link">
                <i class="fas fa-user-circle"></i><span>个人设置</span>
            </a>
        </nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden aria-hidden="true"></div>
    <div class="sidebar-float-cluster" id="sidebarFloatCluster">
        <button type="button" class="sidebar-float-toggle" id="sidebarFloatToggle" aria-label="展开侧栏" title="展开/收起">
            <i class="fas fa-bars"></i>
        </button>
        <span class="sidebar-float-brand">tfhers管理端</span>
    </div>

    <header class="app-topbar" id="appTopbar">
        <div class="app-topbar-inner">
            <h1 class="page-title" id="pageTitle">用户管理</h1>
            <div class="app-top-actions" id="appTopActions">
                <div class="top-avatar-wrap" id="topAvatarWrap">
                    <button type="button" class="top-avatar-btn" id="topAvatarBtn" title="账户" aria-label="账户" aria-haspopup="true" aria-expanded="false">
                        <img id="userAvatar" src="images/CSel3_LargePortTianhuo.png" alt="">
                    </button>
                    <div class="top-account-panel" id="topAccountPanel" hidden role="menu" aria-label="账户面板">
                        <div class="tap-head">
                            <img id="tapAvatar" class="tap-avatar" src="images/CSel3_LargePortTianhuo.png" alt="">
                            <div class="tap-names">
                                <div class="tap-nickname" id="tapNickname">管理员</div>
                                <div class="tap-username" id="tapUsername">@admin</div>
                            </div>
                        </div>
                        <div class="tap-actions">
                            <a href="profile.html?v=1" class="tap-action-btn">
                                <i class="fas fa-user-circle"></i><span>个人资料</span>
                            </a>
                            <button type="button" class="tap-action-btn" id="tapLogoutBtn">
                                <i class="fas fa-sign-out-alt"></i><span>退出登录</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
<!-- 用户管理内容 -->
            <div class="user-management-content">
                <!-- 页面头部 -->
                <div class="page-header">
                    <h2 class="page-title">用户列表</h2>
                    <button class="btn btn-primary" onclick="showCreateUserModal()">
                        <i class="fas fa-plus"></i>
                        添加用户
                    </button>
                </div>

                <!-- 搜索和筛选 -->
                <div class="search-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索用户名、昵称、邮箱或手机号...">
                    <select id="roleFilter" class="filter-select">
                        <option value="">所有角色</option>
                        <option value="USER">普通用户</option>
                        <option value="ADMIN">管理员</option>
                    </select>
                    <select id="statusFilter" class="filter-select">
                        <option value="">所有状态</option>
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                    <button class="btn btn-secondary" onclick="searchUsers()">
                        <i class="fas fa-search"></i>
                        搜索
                    </button>
                    <button class="btn btn-secondary" onclick="resetFilters()">
                        <i class="fas fa-refresh"></i>
                        重置
                    </button>
                </div>

                <!-- 用户表格 -->
                <div class="users-table">
                    <div class="loading" id="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>加载中...</p>
                    </div>
                    
                    <div class="empty-state" id="emptyState" style="display: none;">
                        <i class="fas fa-users"></i>
                        <h3>暂无用户数据</h3>
                        <p>没有找到符合条件的用户</p>
                    </div>
                    
                    <table class="table" id="usersTable" style="display: none;">
                        <thead>
                            <tr>
                                <th>用户信息</th>
                                <th>角色</th>
                                <th>状态</th>
                                <th>最后登录</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <div class="pagination" id="pagination" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <!-- 创建用户模态框 -->
    <div class="modal" id="createUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">添加用户</h3>
                <button class="modal-close" onclick="hideCreateUserModal()">&times;</button>
            </div>
            <form id="createUserForm">
                <div class="form-group">
                    <label for="createUsername">用户名 *</label>
                    <input type="text" id="createUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="createNickname">昵称 *</label>
                    <input type="text" id="createNickname" name="nickname" required>
                </div>
                <div class="form-group">
                    <label for="createPassword">密码 *</label>
                    <input type="password" id="createPassword" name="password" required>
                </div>
                <div class="form-group">
                    <label for="createEmail">邮箱</label>
                    <input type="email" id="createEmail" name="email">
                </div>
                <div class="form-group">
                    <label for="createPhone">手机号</label>
                    <input type="tel" id="createPhone" name="phone">
                </div>
                <div class="form-group">
                    <label for="createRole">角色</label>
                    <select id="createRole" name="role">
                        <option value="USER">普通用户</option>
                        <option value="ADMIN">管理员</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="hideCreateUserModal()">取消</button>
                    <button type="submit" class="btn btn-primary">创建用户</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 编辑用户模态框 -->
    <div class="modal" id="editUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">编辑用户</h3>
                <button class="modal-close" onclick="hideEditUserModal()">&times;</button>
            </div>
            <form id="editUserForm">
                <input type="hidden" id="editUserId" name="id">
                <div class="form-group">
                    <label for="editNickname">昵称 *</label>
                    <input type="text" id="editNickname" name="nickname" required>
                </div>
                <div class="form-group">
                    <label for="editEmail">邮箱</label>
                    <input type="email" id="editEmail" name="email">
                </div>
                <div class="form-group">
                    <label for="editPhone">手机号</label>
                    <input type="tel" id="editPhone" name="phone">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="hideEditUserModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 重置密码模态框 -->
    <div class="modal" id="resetPasswordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">重置密码</h3>
                <button class="modal-close" onclick="hideResetPasswordModal()">&times;</button>
            </div>
            <form id="resetPasswordForm">
                <input type="hidden" id="resetPasswordUserId" name="id">
                <div class="form-group">
                    <label for="newPassword">新密码 *</label>
                    <input type="password" id="newPassword" name="newPassword" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="hideResetPasswordModal()">取消</button>
                    <button type="submit" class="btn btn-warning">重置密码</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/user-management.js"></script>
</main>
<script>
(function () {
    function isMobileSidebar() {
        try { return window.matchMedia('(max-width: 768px)').matches; }
        catch (e) { return window.innerWidth <= 768; }
    }
    function updateChrome() {
        var collapsed = document.documentElement.classList.contains('sidebar-collapsed');
        var floatBtn = document.getElementById('sidebarFloatToggle');
        if (floatBtn) {
            floatBtn.setAttribute('aria-label', collapsed ? '展开侧栏' : '收起侧栏');
        }
    }
    function onToggle(e) {
        if (e) e.preventDefault();
        if (isMobileSidebar()) {
            var open = !document.documentElement.classList.contains('sidebar-open');
            document.documentElement.classList.toggle('sidebar-open', open);
            document.body.classList.toggle('sidebar-open', open);
            var bd = document.getElementById('sidebarBackdrop');
            if (bd) { bd.hidden = !open; bd.setAttribute('aria-hidden', open ? 'false' : 'true'); }
            return;
        }
        var collapsed = !document.documentElement.classList.contains('sidebar-collapsed');
        document.documentElement.classList.toggle('sidebar-collapsed', collapsed);
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        try { localStorage.setItem('tfhers_admin_sidebar_collapsed', collapsed ? '1' : '0'); } catch (err) {}
        updateChrome();
    }
    function closeMenu() {
        document.documentElement.classList.remove('sidebar-open');
        document.body.classList.remove('sidebar-open');
        var bd = document.getElementById('sidebarBackdrop');
        if (bd) { bd.hidden = true; bd.setAttribute('aria-hidden', 'true'); }
    }
    try {
        if (localStorage.getItem('tfhers_admin_sidebar_collapsed') === '1') {
            document.documentElement.classList.add('sidebar-collapsed');
            document.body.classList.add('sidebar-collapsed');
        }
    } catch (e) {}
    updateChrome();
    var t1 = document.getElementById('sidebarToggle');
    var t2 = document.getElementById('sidebarFloatToggle');
    var bd = document.getElementById('sidebarBackdrop');
    if (t1) t1.addEventListener('click', onToggle);
    if (t2) t2.addEventListener('click', onToggle);
    if (bd) bd.addEventListener('click', closeMenu);

    var wrap = document.getElementById('topAvatarWrap');
    var btn = document.getElementById('topAvatarBtn');
    var panel = document.getElementById('topAccountPanel');
    function closePanel() {
        if (!wrap) return;
        wrap.classList.remove('is-open');
        if (panel) panel.hidden = true;
        if (btn) btn.setAttribute('aria-expanded', 'false');
    }
    if (btn && wrap && panel) {
        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (wrap.classList.contains('is-open')) closePanel();
            else { wrap.classList.add('is-open'); panel.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
        });
        panel.addEventListener('click', function (e) { e.stopPropagation(); });
        document.addEventListener('click', closePanel);
    }
    var logoutBtn = document.getElementById('tapLogoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', function () {
            try {
                localStorage.removeItem('admin_token');
                localStorage.removeItem('user');
            } catch (e) {}
            location.href = 'admin-login.html';
        });
    }
    try {
        var raw = localStorage.getItem('user');
        if (raw) {
            var u = JSON.parse(raw);
            var name = u.realName || u.username || '管理员';
            var uname = u.username || 'admin';
            var av = u.avatarUrl || 'images/CSel3_LargePortTianhuo.png';
            var el;
            el = document.getElementById('tapNickname'); if (el) el.textContent = name;
            el = document.getElementById('tapUsername'); if (el) el.textContent = '@' + uname;
            el = document.getElementById('userAvatar'); if (el) el.src = av;
            el = document.getElementById('tapAvatar'); if (el) el.src = av;
        }
    } catch (e) {}
})();
</script>

</body>
</html>
