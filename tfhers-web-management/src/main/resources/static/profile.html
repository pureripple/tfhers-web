<!DOCTYPE html>
<html lang="zh-CN" class="tfhers-admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人设置 - TFhers管理后台</title>
    <link rel="stylesheet" href="css/fonts-local.css">
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="css/index.css?v=20261024a">
    <style>
        /* 个人设置页面特有样式（主题变量见 css/index.css） */
        .profile-content {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-loading-hint {
            margin: 0 0 16px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .profile-loading-hint[hidden] {
            display: none;
        }
        
        .profile-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
        }
        
        .tab-btn {
            background: none;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab-btn:hover {
            color: var(--accent-primary);
            background-color: var(--bg-tertiary);
        }
        
        .tab-btn.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
            font-weight: 600;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .profile-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 1px 3px var(--shadow);
            border: 1px solid var(--border-color);
        }
        
        .profile-card h3 {
            margin: 0 0 25px 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: rgba(255, 122, 122, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 122, 122, 0.12);
        }
        
        .form-group input[readonly] {
            background-color: var(--bg-quaternary);
            color: var(--text-muted);
            cursor: not-allowed;
        }
        
        .form-text {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        /* 头像设置样式 */
        .avatar-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }
        
        .current-avatar h4,
        .avatar-upload h4 {
            margin: 0 0 20px 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .avatar-preview {
            text-align: center;
        }
        
        .avatar-preview img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-color);
            box-shadow: 0 4px 6px var(--shadow);
        }
        
        /* 上传区域样式 */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: var(--bg-tertiary);
        }
        
        .upload-area:hover {
            border-color: var(--accent-primary);
            background-color: var(--bg-quaternary);
        }
        
        .upload-area.dragover {
            border-color: var(--accent-primary);
            background-color: var(--bg-quaternary);
        }
        
        .upload-area i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: block;
        }
        
        .upload-area p {
            margin: 8px 0;
            color: var(--text-secondary);
        }
        
        .upload-tip {
            font-size: 12px !important;
            color: var(--text-muted) !important;
        }
        
        /* 上传进度条 */
        .upload-progress {
            margin-top: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--bg-quaternary);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background-color: var(--accent-primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            display: block;
        }
        
        /* 消息提示样式 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 6px var(--shadow);
            padding: 16px 20px;
            z-index: 9999;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            max-width: 400px;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .toast-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }
        
        .toast.success .toast-icon {
            background-color: var(--success-color);
        }
        
        .toast.success .toast-icon::before {
            content: "✓";
        }
        
        .toast.error .toast-icon {
            background-color: var(--danger-color);
        }
        
        .toast.error .toast-icon::before {
            content: "✕";
        }
        
        .toast-message {
            color: var(--text-primary);
            font-size: 14px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .profile-content {
                padding: 15px;
            }
            
            .avatar-section {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
            <aside class="app-sidebar" id="appSidebar" aria-label="管理导航">
        <div class="sidebar-top">
            <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="收起侧栏" title="收起/展开">
                <i class="fas fa-bars"></i>
            </button>
            <span class="sidebar-brand">tfhers管理端</span>
        </div>
        <nav class="sidebar-nav" id="navMenu">
            <a href="index.html#articles" class="nav-link">
                <i class="fas fa-newspaper"></i><span>资讯管理</span>
            </a>
            <a href="index.html#characters" class="nav-link">
                <i class="fas fa-users"></i><span>角色管理</span>
            </a>
            <a href="index.html#user-combos" class="nav-link">
                <i class="fas fa-user-check"></i><span>用户连段审核</span>
            </a>
            <a href="index.html#reports" class="nav-link">
                <i class="fas fa-flag"></i><span>举报处理</span>
            </a>
            <a href="index.html#feedback" class="nav-link">
                <i class="fas fa-comment-dots"></i><span>问题反馈</span>
            </a>
            <a href="index.html#comment-review" class="nav-link">
                <i class="fas fa-comments"></i><span>评论审核</span>
            </a>
            <a href="index.html#statistics" class="nav-link">
                <i class="fas fa-chart-line"></i><span>数据统计</span>
            </a>
            <a href="index.html#games" class="nav-link">
                <i class="fas fa-gamepad"></i><span>游戏管理</span>
            </a>
            <a href="index.html#tournaments" class="nav-link">
                <i class="fas fa-trophy"></i><span>赛事管理</span>
            </a>
            <a href="ai-chat.html" class="nav-link nav-link-ai">
                <i class="fas fa-robot"></i><span>AI 助手</span>
            </a>
            <a href="user-management.html?v=1" class="nav-link">
                <i class="fas fa-user-cog"></i><span>用户管理</span>

                <i class="fas fa-user-circle"></i><span>个人设置</span>
            </a>
        </nav>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden aria-hidden="true"></div>
    <div class="sidebar-float-cluster" id="sidebarFloatCluster">
        <button type="button" class="sidebar-float-toggle" id="sidebarFloatToggle" aria-label="展开侧栏" title="展开/收起">
            <i class="fas fa-bars"></i>
        </button>
        <span class="sidebar-float-brand">tfhers管理端</span>
    </div>

    <header class="app-topbar" id="appTopbar">
        <div class="app-topbar-inner">
            <h1 class="page-title" id="pageTitle">个人设置</h1>
            <div class="app-top-actions" id="appTopActions">
                <div class="top-avatar-wrap" id="topAvatarWrap">
                    <button type="button" class="top-avatar-btn" id="topAvatarBtn" title="账户" aria-label="账户" aria-haspopup="true" aria-expanded="false">
                        <img id="userAvatar" src="images/CSel3_LargePortTianhuo.png" alt="">
                    </button>
                    <div class="top-account-panel" id="topAccountPanel" hidden role="menu" aria-label="账户面板">
                        <div class="tap-head">
                            <img id="tapAvatar" class="tap-avatar" src="images/CSel3_LargePortTianhuo.png" alt="">
                            <div class="tap-names">
                                <div class="tap-nickname" id="tapNickname">管理员</div>
                                <div class="tap-username" id="tapUsername">@admin</div>
                            </div>
                        </div>
                        <div class="tap-actions">
                            <a href="profile.html?v=1" class="tap-action-btn">
                                <i class="fas fa-user-circle"></i><span>个人资料</span>
                            </a>
                            <button type="button" class="tap-action-btn" id="tapLogoutBtn">
                                <i class="fas fa-sign-out-alt"></i><span>退出登录</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
<!-- 个人设置内容 -->
            <div class="profile-content">
                <p class="profile-loading-hint" id="profileLoadingHint" role="status">正在加载个人信息…</p>
                <div class="profile-tabs">
                    <button class="tab-btn active" data-tab="basic">基本信息</button>
                    <button class="tab-btn" data-tab="avatar">头像设置</button>
                    <button class="tab-btn" data-tab="password">修改密码</button>
                </div>

                <!-- 基本信息标签页 -->
                <div class="tab-content active" id="basicTab">
                    <div class="profile-card">
                        <h3>基本信息</h3>
                        <form id="basicInfoForm" class="profile-form">
                            <div class="form-group">
                                <label for="username">用户名</label>
                                <input type="text" id="username" name="username" readonly>
                                <small class="form-text">用户名不可修改</small>
                            </div>
                            <div class="form-group">
                                <label for="realName">真实姓名</label>
                                <input type="text" id="realName" name="realName" placeholder="请输入真实姓名">
                            </div>
                            <div class="form-group">
                                <label for="email">邮箱地址</label>
                                <input type="email" id="email" name="email" placeholder="请输入邮箱地址">
                            </div>
                            <div class="form-group">
                                <label for="phone">手机号码</label>
                                <input type="tel" id="phone" name="phone" placeholder="请输入手机号码">
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">保存修改</button>
                                <button type="button" class="btn btn-secondary" onclick="resetBasicForm()">重置</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 头像设置标签页 -->
                <div class="tab-content" id="avatarTab">
                    <div class="profile-card">
                        <h3>头像设置</h3>
                        <div class="avatar-section">
                            <div class="current-avatar">
                                <h4>当前头像</h4>
                                <div class="avatar-preview">
                                    <img src="images/CSel3_LargePortTianhuo.png" alt="当前头像" id="currentAvatar">
                                </div>
                            </div>
                            <div class="avatar-upload">
                                <h4>上传新头像</h4>
                                <div class="upload-area" id="uploadArea">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <p>点击或拖拽文件到此处上传</p>
                                    <p class="upload-tip">支持 JPG、PNG、GIF 格式，文件大小不超过 5MB</p>
                                    <input type="file" id="avatarFile" accept="image/*" style="display: none;">
                                </div>
                                <div class="upload-progress" id="uploadProgress" style="display: none;">
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="progressFill"></div>
                                    </div>
                                    <span class="progress-text" id="progressText">0%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 修改密码标签页 -->
                <div class="tab-content" id="passwordTab">
                    <div class="profile-card">
                        <h3>修改密码</h3>
                        <form id="changePasswordForm" class="profile-form">
                            <div class="form-group">
                                <label for="oldPassword">当前密码</label>
                                <input type="password" id="oldPassword" name="oldPassword" placeholder="请输入当前密码">
                            </div>
                            <div class="form-group">
                                <label for="newPassword">新密码</label>
                                <input type="password" id="newPassword" name="newPassword" placeholder="请输入新密码">
                                <small class="form-text">密码长度至少6位</small>
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">确认新密码</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入新密码">
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">修改密码</button>
                                <button type="button" class="btn btn-secondary" onclick="resetPasswordForm()">重置</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div class="toast" id="toast">
        <div class="toast-content">
            <i class="toast-icon"></i>
            <span class="toast-message"></span>
        </div>
    </div>

    <script src="js/profile.js"></script>
</main>
<script>
(function () {
    function isMobileSidebar() {
        try { return window.matchMedia('(max-width: 768px)').matches; }
        catch (e) { return window.innerWidth <= 768; }
    }
    function updateChrome() {
        var collapsed = document.documentElement.classList.contains('sidebar-collapsed');
        var floatBtn = document.getElementById('sidebarFloatToggle');
        if (floatBtn) {
            floatBtn.setAttribute('aria-label', collapsed ? '展开侧栏' : '收起侧栏');
        }
    }
    function onToggle(e) {
        if (e) e.preventDefault();
        if (isMobileSidebar()) {
            var open = !document.documentElement.classList.contains('sidebar-open');
            document.documentElement.classList.toggle('sidebar-open', open);
            document.body.classList.toggle('sidebar-open', open);
            var bd = document.getElementById('sidebarBackdrop');
            if (bd) { bd.hidden = !open; bd.setAttribute('aria-hidden', open ? 'false' : 'true'); }
            return;
        }
        var collapsed = !document.documentElement.classList.contains('sidebar-collapsed');
        document.documentElement.classList.toggle('sidebar-collapsed', collapsed);
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        try { localStorage.setItem('tfhers_admin_sidebar_collapsed', collapsed ? '1' : '0'); } catch (err) {}
        updateChrome();
    }
    function closeMenu() {
        document.documentElement.classList.remove('sidebar-open');
        document.body.classList.remove('sidebar-open');
        var bd = document.getElementById('sidebarBackdrop');
        if (bd) { bd.hidden = true; bd.setAttribute('aria-hidden', 'true'); }
    }
    try {
        if (localStorage.getItem('tfhers_admin_sidebar_collapsed') === '1') {
            document.documentElement.classList.add('sidebar-collapsed');
            document.body.classList.add('sidebar-collapsed');
        }
    } catch (e) {}
    updateChrome();
    var t1 = document.getElementById('sidebarToggle');
    var t2 = document.getElementById('sidebarFloatToggle');
    var bd = document.getElementById('sidebarBackdrop');
    if (t1) t1.addEventListener('click', onToggle);
    if (t2) t2.addEventListener('click', onToggle);
    if (bd) bd.addEventListener('click', closeMenu);

    var wrap = document.getElementById('topAvatarWrap');
    var btn = document.getElementById('topAvatarBtn');
    var panel = document.getElementById('topAccountPanel');
    function closePanel() {
        if (!wrap) return;
        wrap.classList.remove('is-open');
        if (panel) panel.hidden = true;
        if (btn) btn.setAttribute('aria-expanded', 'false');
    }
    if (btn && wrap && panel) {
        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (wrap.classList.contains('is-open')) closePanel();
            else { wrap.classList.add('is-open'); panel.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
        });
        panel.addEventListener('click', function (e) { e.stopPropagation(); });
        document.addEventListener('click', closePanel);
    }
    var logoutBtn = document.getElementById('tapLogoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', function () {
            try {
                localStorage.removeItem('admin_token');
                localStorage.removeItem('user');
            } catch (e) {}
            location.href = 'admin-login.html';
        });
    }
    try {
        var raw = localStorage.getItem('user');
        if (raw) {
            var u = JSON.parse(raw);
            var name = u.realName || u.username || '管理员';
            var uname = u.username || 'admin';
            var av = u.avatarUrl || 'images/CSel3_LargePortTianhuo.png';
            var el;
            el = document.getElementById('tapNickname'); if (el) el.textContent = name;
            el = document.getElementById('tapUsername'); if (el) el.textContent = '@' + uname;
            el = document.getElementById('userAvatar'); if (el) el.src = av;
            el = document.getElementById('tapAvatar'); if (el) el.src = av;
        }
    } catch (e) {}
})();
</script>

</body>
</html>
