<!DOCTYPE html>
<html lang="zh-CN" class="tfhers-admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手 - 蹄斗助手后台</title>
    <link rel="stylesheet" href="css/fonts-local.css">
    <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="css/index.css?v=20261024e">
    <link rel="stylesheet" href="css/ai-chat.css?v=20261024e">
</head>
<body class="admin-ai-chat-page">

    <aside class="app-sidebar" id="appSidebar" aria-label="管理导航">
        <div class="sidebar-top">
            <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="收起侧栏" title="收起/展开">
                <i class="fas fa-bars"></i>
            </button>
            <span class="sidebar-brand">tfhers管理端</span>
        </div>
        <nav class="sidebar-nav" id="navMenu">
            <a href="index.html#articles" class="nav-link">
                <i class="fas fa-newspaper"></i><span>资讯管理</span>
            </a>
            <a href="index.html#characters" class="nav-link">
                <i class="fas fa-users"></i><span>角色管理</span>
            </a>
            <a href="index.html#user-combos" class="nav-link">
                <i class="fas fa-user-check"></i><span>用户连段审核</span>
            </a>
            <a href="index.html#reports" class="nav-link">
                <i class="fas fa-flag"></i><span>举报处理</span>
            </a>
            <a href="index.html#feedback" class="nav-link">
                <i class="fas fa-comment-dots"></i><span>问题反馈</span>
            </a>
            <a href="index.html#comment-review" class="nav-link">
                <i class="fas fa-comments"></i><span>评论审核</span>
            </a>
            <a href="index.html#statistics" class="nav-link">
                <i class="fas fa-chart-line"></i><span>数据统计</span>
            </a>
            <a href="index.html#games" class="nav-link">
                <i class="fas fa-gamepad"></i><span>游戏管理</span>
            </a>
            <a href="index.html#tournaments" class="nav-link">
                <i class="fas fa-trophy"></i><span>赛事管理</span>
            </a>
            <a href="ai-chat.html?v=20261024e" class="nav-link nav-link-ai active">
                <i class="fas fa-robot"></i><span>AI 助手</span>
            </a>
            <a href="user-management.html?v=1" class="nav-link">
                <i class="fas fa-user-cog"></i><span>用户管理</span>
            </a>
            <a href="profile.html?v=1" class="nav-link">
                <i class="fas fa-user-circle"></i><span>个人设置</span>
            </a>
        </nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden aria-hidden="true"></div>
    <div class="sidebar-float-cluster" id="sidebarFloatCluster">
        <button type="button" class="sidebar-float-toggle" id="sidebarFloatToggle" aria-label="展开侧栏" title="展开/收起">
            <i class="fas fa-bars"></i>
        </button>
        <span class="sidebar-float-brand">tfhers管理端</span>
    </div>

    <header class="app-topbar" id="appTopbar">
        <div class="app-topbar-inner">
            <h1 class="page-title" id="pageTitle">AI 助手</h1>
            <div class="app-top-actions" id="appTopActions">
                <div class="top-avatar-wrap" id="topAvatarWrap">
                    <button type="button" class="top-avatar-btn" id="topAvatarBtn" title="账户" aria-label="账户" aria-haspopup="true" aria-expanded="false">
                        <img id="userAvatar" src="images/CSel3_LargePortTianhuo.png" alt="">
                    </button>
                    <div class="top-account-panel" id="topAccountPanel" hidden role="menu" aria-label="账户面板">
                        <div class="tap-head">
                            <img id="tapAvatar" class="tap-avatar" src="images/CSel3_LargePortTianhuo.png" alt="">
                            <div class="tap-names">
                                <div class="tap-nickname" id="tapNickname">管理员</div>
                                <div class="tap-username" id="tapUsername">@admin</div>
                            </div>
                        </div>
                        <div class="tap-actions">
                            <a href="profile.html?v=1" class="tap-action-btn">
                                <i class="fas fa-user-circle"></i><span>个人资料</span>
                            </a>
                            <button type="button" class="tap-action-btn" id="tapLogoutBtn" onclick="logout()">
                                <i class="fas fa-sign-out-alt"></i><span>退出登录</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="admin-ai-chat-inner">
            <div class="ai-chat-layout grok-layout">
                <div class="grok-chat-panel">
                    <header class="grok-head">
                        <div class="grok-head-left">
                            <span class="grok-model-badge">蹄斗 AI</span>
                            <span class="status-indicator grok-status-dot is-online" id="aiStatus">
                                <i class="fas fa-circle"></i>
                                <span class="grok-status-text">在线</span>
                            </span>
                        </div>
                        <div class="grok-head-actions">
                            <div class="chat-history-nav grok-history-wrap">
                                <button type="button" class="grok-icon-btn history-toggle" id="historyToggle" title="历史记录">
                                    <i class="fas fa-history"></i>
                                </button>
                                <div class="history-dropdown grok-history-dropdown" id="historyDropdown">
                                    <div class="history-header">
                                        <h4>最近对话</h4>
                                        <button type="button" class="clear-history-btn" id="clearHistoryBtn" title="清空">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                    <div class="history-list" id="historyList"></div>
                                </div>
                            </div>
                            <button type="button" class="grok-icon-btn" id="clearChatBtn" title="清空当前对话">
                                <i class="fas fa-broom"></i>
                            </button>
                            <button type="button" class="grok-icon-btn" id="exportChatBtn" title="导出记录">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </header>

                    <div class="grok-thread">
                        <div class="messages-container grok-messages" id="messagesContainer">
                            <div class="message ai-message grok-msg grok-msg--assistant grok-msg--appear" id="welcomeMessage">
                                <div class="message-avatar grok-msg-avatar grok-msg-avatar--img">
                                    <img src="images/CSel3_LargePortOleander.png" alt="" id="welcomeAiAvatar"
                                         onerror="this.onerror=null;this.src='images/CSel3_LargePortTianhuo.png'">
                                </div>
                                <div class="message-content grok-msg-body">
                                    <div class="message-text">
                                        你好，我是蹄斗族群 AI 助手。可以问我角色、技能、攻略等问题。
                                    </div>
                                    <div class="message-time grok-msg-time">刚刚</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grok-composer">
                        <div class="grok-composer-field">
                            <textarea
                                id="messageInput"
                                class="grok-textarea"
                                placeholder="询问任何问题…"
                                rows="1"
                                maxlength="1000"
                            ></textarea>
                            <button type="button" class="grok-send-btn" id="sendBtn" disabled title="发送">
                                <i class="fas fa-arrow-up"></i>
                            </button>
                        </div>
                        <div class="grok-composer-meta">
                            <span class="char-count grok-char-count" id="charCount">0 / 1000</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
    </main>

    <div id="loadingIndicator" class="loading-indicator">
        <div class="spinner"></div>
        <p>AI 正在思考中…</p>
    </div>

    <div id="messageToast" class="message-toast">
        <i class="fas fa-check-circle"></i>
        <span id="messageText">操作成功</span>
    </div>

    <script src="js/ai-chat.js?v=20261024e"></script>
</body>
</html>
