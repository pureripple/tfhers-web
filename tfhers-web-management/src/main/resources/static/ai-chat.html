<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI游戏助手 - 蹄斗族群助手</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/ai-chat.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-fist-raised"></i>
                <span>蹄斗助手</span>
            </div>
            <div class="admin-title">AI游戏助手</div>
        </div>
        
        <nav class="sidebar-nav">
            <ul class="nav-list">
                <!-- AI聊天页面不需要额外的导航链接 -->
            </ul>
        </nav>
    </aside>

    <!-- 主内容区域 -->
    <main class="main-content">
        <!-- 顶部导航栏 -->
        <header class="top-header">
            <div class="header-left">
                <h1 class="page-title">
                    <i class="fas fa-robot"></i>
                    AI游戏助手
                </h1>
            </div>
            <div class="header-center">
                <div class="chat-history-nav">
                    <button class="history-toggle" id="historyToggle" title="对话历史">
                        <i class="fas fa-history"></i>
                        <span>历史记录</span>
                    </button>
                    <div class="history-dropdown" id="historyDropdown">
                        <div class="history-header">
                            <h4>对话历史</h4>
                            <button class="clear-history-btn" id="clearHistoryBtn" title="清空历史">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        <div class="history-list" id="historyList">
                            <!-- 历史记录将通过JavaScript动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="ai-status">
                    <span class="status-indicator" id="aiStatus">
                        <i class="fas fa-circle"></i>
                        在线
                    </span>
                </div>
            </div>
        </header>

        <!-- AI聊天内容 -->
        <div class="ai-chat-container">
            <!-- 聊天区域 -->
            <div class="chat-area full-width">
                <div class="chat-header">
                    <div class="ai-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="ai-info">
                        <h3>蹄斗族群AI助手</h3>
                        <p>我是您的专属游戏助手，可以回答关于蹄斗族群的各种问题</p>
                    </div>
                    <div class="chat-actions">
                        <button class="btn btn-secondary" id="clearChatBtn" title="清空对话">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="btn btn-secondary" id="exportChatBtn" title="导出对话">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>

                <!-- 消息列表 -->
                <div class="messages-container" id="messagesContainer">
                    <div class="message ai-message">
                        <div class="message-avatar">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-text">
                                您好！我是蹄斗族群AI助手，很高兴为您服务！您可以问我关于游戏角色、技能、攻略等任何问题。
                            </div>
                            <div class="message-time">刚刚</div>
                        </div>
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="input-area">
                    <div class="input-container">
                        <textarea 
                            id="messageInput" 
                            placeholder="请输入您的问题..." 
                            rows="1"
                            maxlength="1000"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" disabled>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="input-footer">
                        <span class="char-count" id="charCount">0/1000</span>
                        <div class="quick-questions">
                            <span class="quick-label">快速提问：</span>
                            <button class="quick-btn" data-question="蹄斗族群有哪些角色？">角色介绍</button>
                            <button class="quick-btn" data-question="如何提升角色等级？">升级攻略</button>
                            <button class="quick-btn" data-question="游戏中有哪些技能？">技能系统</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 加载指示器 -->
    <div id="loadingIndicator" class="loading-indicator">
        <div class="spinner"></div>
        <p>AI正在思考中...</p>
    </div>

    <!-- 消息提示 -->
    <div id="messageToast" class="message-toast">
        <i class="fas fa-check-circle"></i>
        <span id="messageText">操作成功</span>
    </div>

    <!-- AI助手固定按钮 -->
    <a href="index.html" class="ai-assistant-fab" title="返回主页">
        <i class="fas fa-robot"></i>
    </a>

    <script src="js/ai-chat.js"></script>
</body>
</html>
