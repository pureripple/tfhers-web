spring:
  application:
    name: tfhers-web-management
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB
  datasource:
    url: ${TFHERS_DB_URL:jdbc:mysql://localhost:3306/tfhers}
    username: ${TFHERS_DB_USERNAME:root}
    password: ${TFHERS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway: versioned migrations under classpath:db/migration
  # Existing prod DB (tables present, no flyway_schema_history): baseline at 1, then apply V2+
  # Empty/new DB: skip baseline, apply V2+ from scratch
  # Fail-fast on migration error (Spring Boot / Flyway default)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing schema before Flyway

  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 服务器配置
server:
  port: 8081
  tomcat:
    connection-timeout: 600000
    max-swallow-size: -1

# JWT配置（JWT_SECRET 必须通过环境变量提供，勿提交明文）
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7 days in milliseconds

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET:tfhers}
    domain: ${ALIYUN_OSS_DOMAIN:https://tfhers.oss-cn-beijing.aliyuncs.com}
  green:
    # 内容安全（Green）文本审核：TextModeration
    # 建议使用 RAM 子账号 + 最小权限（yundun-greenweb:TextModeration）
    access-key-id: ${ALIYUN_GREEN_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_GREEN_ACCESS_KEY_SECRET}
    region-id: ${ALIYUN_GREEN_REGION_ID:cn-beijing}
    endpoint: ${ALIYUN_GREEN_ENDPOINT:green.cn-beijing.aliyuncs.com}
    # 注意：TextModeration 的 Service 枚举通常为 comment_detection
    service: ${ALIYUN_GREEN_SERVICE:comment_detection}
    # 审核服务不可用时是否放行：true=放行；false=拒绝
    fail-open: ${ALIYUN_GREEN_FAIL_OPEN:false}

# langchain4j配置（API Key 走环境变量）
langchain4j:
  openai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${LANGCHAIN4J_API_KEY}
      model-name: qwen-plus

    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${LANGCHAIN4J_API_KEY}
      model-name: qwen-plus

# 前端站点根。Steam 绑定成功后的 Location 为 {base}/settings。
# 本地默认 Vite；生产必须设置 FRONTEND_BASE_URL（例如 http://tfhers.cn），否则浏览器会被送回本机。
tfhers:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

# Steam 接口配置
# return-url / realm 本地默认 localhost:8081。生产必须设置 STEAM_RETURN_URL、STEAM_REALM，
# 否则 OpenID return_to 仍指向本机，Steam 跳回后浏览器 connection refused。
steam:
  api-key: ${STEAM_API_KEY}
  app-id: 574980
  return-url: ${STEAM_RETURN_URL:http://localhost:8081/api/user/steam/callback}
  realm: ${STEAM_REALM:http://localhost:8081}

  # Steam 总时长缓存
  playtime:
    cache-ttl-minutes: 60

  # 后台定时同步
  playtime-sync:
    enabled: true
    fixed-delay-ms: 1800000
    max-per-run: 50
    min-updated-hours: 1
    log-path: logs/steam-playtime-sync.log

# Data cleanup (rooms hard-delete / OSS orphans / old reports)
cleanup:
  rooms:
    enabled: true
    retention-days: 7
    cron: "0 30 3 * * ?"
  oss-orphans:
    enabled: true
    min-age-days: 7
    dry-run: false
    cron: "0 0 4 * * ?"
    max-delete-per-run: 200
  content-reports:
    enabled: true
    retention-days: 14
    cron: "0 0 5 * * ?"

# 房间大厅在线检测
rooms:
  presence:
    enabled: true
    timeout-seconds: 45
    sweep-interval-ms: 15000

# 赛事：报名截止自动关报名（不自动生成对阵）
tournaments:
  registration-auto-close:
    enabled: true
    fixed-delay-ms: 60000
    initial-delay-ms: 8000
