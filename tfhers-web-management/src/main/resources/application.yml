spring:
  application:
    name: tfhers-web-management
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: ${TFHERS_DB_URL:jdbc:mysql://localhost:3306/tfhers}
    username: ${TFHERS_DB_USERNAME:root}
    password: ${TFHERS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway: versioned migrations under classpath:db/migration
  # Existing prod DB (tables present, no flyway_schema_history): baseline at 1, then apply V2+
  # Empty/new DB: skip baseline, apply V2+ from scratch
  # Fail-fast on migration error (Spring Boot / Flyway default)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing schema before Flyway

  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true

# MyBatis閰嶇疆
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.pojo
  configuration:
    map-underscore-to-camel-case: true
    # 不要用 StdOutImpl：它把每一条 SQL 直接打到 stdout，systemd journal 会无限增长，
    # 写满系统盘后 MySQL 写入失败 = 全站 500。Slf4jImpl 走日志框架，默认 INFO 级不输出 SQL。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 鏈嶅姟鍣ㄩ厤缃?
server:
  port: 8081
  tomcat:
    connection-timeout: 600000
    max-swallow-size: -1

# JWT閰嶇疆锛圝WT_SECRET 蹇呴』閫氳繃鐜鍙橀噺鎻愪緵锛屽嬁鎻愪氦鏄庢枃锛?
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7 days in milliseconds

# 闃块噷浜慜SS閰嶇疆
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${ALIYUN_OSS_BUCKET:tfhers}
    domain: ${ALIYUN_OSS_DOMAIN:https://tfhers.oss-cn-beijing.aliyuncs.com}
  green:
    # 鍐呭瀹夊叏锛圙reen锛夋枃鏈鏍革細TextModeration
    # 寤鸿浣跨敤 RAM 瀛愯处鍙?+ 鏈€灏忔潈闄愶紙yundun-greenweb:TextModeration锛?
    access-key-id: ${ALIYUN_GREEN_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_GREEN_ACCESS_KEY_SECRET}
    region-id: ${ALIYUN_GREEN_REGION_ID:cn-beijing}
    endpoint: ${ALIYUN_GREEN_ENDPOINT:green.cn-beijing.aliyuncs.com}
    # 娉ㄦ剰锛歍extModeration 鐨?Service 鏋氫妇閫氬父涓?comment_detection
    service: ${ALIYUN_GREEN_SERVICE:comment_detection}
    # 瀹℃牳鏈嶅姟涓嶅彲鐢ㄦ椂鏄惁鏀捐锛歵rue=鏀捐锛沠alse=鎷掔粷
    fail-open: ${ALIYUN_GREEN_FAIL_OPEN:false}

# langchain4j閰嶇疆锛圓PI Key 璧扮幆澧冨彉閲忥級
langchain4j:
  openai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${LANGCHAIN4J_API_KEY}
      model-name: qwen-plus

    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${LANGCHAIN4J_API_KEY}
      model-name: qwen-plus

# Steam 鎺ュ彛閰嶇疆
# Steam 接口配置
# return-url / realm 本地默认 localhost:8081。生产必须设置 STEAM_RETURN_URL、STEAM_REALM，
# 否则 OpenID return_to 仍指向本机，Steam 跳回后浏览器 connection refused。
steam:
  api-key: ${STEAM_API_KEY}
  app-id: 574980
  return-url: ${STEAM_RETURN_URL:http://localhost:8081/api/user/steam/callback}
  realm: ${STEAM_REALM:http://localhost:8081}

  # Steam 鎬绘椂闀跨紦瀛?
  playtime:
    cache-ttl-minutes: 60

  # 鍚庡彴瀹氭椂鍚屾
  playtime-sync:
    enabled: true
    fixed-delay-ms: 1800000
    max-per-run: 50
    min-updated-hours: 1
    log-path: logs/steam-playtime-sync.log

# Data cleanup (rooms hard-delete / OSS orphans / old reports)
cleanup:
  rooms:
    enabled: true
    retention-days: 7
    cron: "0 30 3 * * ?"
  oss-orphans:
    enabled: true
    min-age-days: 7
    dry-run: false
    cron: "0 0 4 * * ?"
    max-delete-per-run: 200
  content-reports:
    enabled: true
    retention-days: 14
    cron: "0 0 5 * * ?"

# 鎴块棿澶у巺鍦ㄧ嚎妫€娴?
rooms:
  presence:
    enabled: true
    timeout-seconds: ${ROOMS_PRESENCE_TIMEOUT_SECONDS:300}
    sweep-interval-ms: 15000

# 璧涗簨锛氭姤鍚嶆埅姝㈣嚜鍔ㄥ叧鎶ュ悕锛堜笉鑷姩鐢熸垚瀵归樀锛?
tournaments:
  registration-auto-close:
    enabled: true
    fixed-delay-ms: 60000
    initial-delay-ms: 8000

# CORS: comma-separated Origins. Prod must set CORS_ALLOWED_ORIGINS (no *).
# Dev profile may use *. Default below is local-friendly when no profile/env set.
tfhers:
  # 前端站点根。Steam 绑定成功后的 Location 为 {base}/settings。
  # 本地默认 Vite；生产必须设置 FRONTEND_BASE_URL（例如 http://8.155.136.50），否则浏览器会被送回本机。
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080,http://localhost:8081}"

# 日志：默认 INFO，**不打印每条 SQL**（MyBatis 的 SQL 日志是 DEBUG 级，被下面的 INFO 挡住）。
# 需要临时排查 SQL 时不要改文件，用启动参数/环境变量临时打开：
#   --logging.level.com.example.mapper=DEBUG
# 落盘策略：只写 stdout，由 systemd journald 接管，用 SystemMaxUse 限制总量
# （见 deploy/systemd/journald-size.conf），避免自己写文件把磁盘吃掉。
logging:
  level:
    root: INFO
    com.example: INFO
    # 需要看 SQL 时把这个改成 DEBUG（或启动参数临时覆盖）
    com.example.mapper: INFO
    org.mybatis: WARN
    org.springframework.jdbc: INFO
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
