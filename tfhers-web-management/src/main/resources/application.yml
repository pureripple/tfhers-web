# steam接口配置
steam:
  api-key: "56229265FD2BA42CFA31D883E801D410"
  app-id: 574980  # 填 TFH 的 AppID，或先留空自己查
  return-url: "http://localhost:8081/api/user/steam/callback"
  realm: "http://localhost:8081"  # 你的后台域名

  # Steam 总时长缓存：如果 users.steam_playtime_updated_at 在此时间内，
  # /steam/playtime 会直接返回缓存，避免频繁打 Steam
  playtime:
    cache-ttl-minutes: 60

  # 后台定时同步（把已绑定 Steam 的用户总时长写回 users 缓存 + steam_playtime_history）
  playtime-sync:
    enabled: true
    fixed-delay-ms: 1800000          # 30 分钟
    max-per-run: 50
    min-updated-hours: 1             # 上次同步超过该阈值的用户才会被本次拉取（更接近实时）
    log-path: logs/steam-playtime-sync.log