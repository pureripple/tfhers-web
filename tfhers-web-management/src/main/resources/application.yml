spring:
  application:
    name: tfhers-web-management
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  datasource:
    url: jdbc:mysql://localhost:3306/tfhers
    username: root
    password: 974629
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 服务器配置
server:
  port: 8081

# JWT配置
jwt:
  secret: tfhers-web-management-jwt-secret-key-2025
  expiration: 360  # 1小时，单位：毫秒

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com  # OSS区域端点
    access-key-id: LTAI5tDfHnxDEYYUumu1cqLA  # AccessKeyId
    access-key-secret: 6h44TXBT6gnKj7v69Xoy29VqSCJpgD  # AccessKeySecret
    bucket-name: tfhers  # Bucket名称
    domain: https://tfhers.oss-cn-beijing.aliyuncs.com  # OSS域名
  green:
    # 内容安全（Green）文本审核：TextModeration
    # 建议使用 RAM 子账号 + 最小权限（yundun-greenweb:TextModeration）
    access-key-id: LTAI5tDfHnxDEYYUumu1cqLA
    access-key-secret: 6h44TXBT6gnKj7v69Xoy29VqSCJpgD
    region-id: ${ALIYUN_GREEN_REGION_ID:cn-beijing}
    endpoint: ${ALIYUN_GREEN_ENDPOINT:green.cn-beijing.aliyuncs.com}
    # 注意：TextModeration 的 Service 枚举通常是 comment_detection（控制台“专业版”也可能仍用该值）
    service: ${ALIYUN_GREEN_SERVICE:comment_detection}
    # 审核服务不可用时是否放行：true=放行；false=拒绝（更安全但可能误伤正常评论）
    fail-open: ${ALIYUN_GREEN_FAIL_OPEN:false}

